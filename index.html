<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sunrise Place Homeowner Portal</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f7f2ea;
            --surface: #fff;
            --surface2: #faf6f0;
            --fg: #2a2320;
            --muted: #6b5f57;
            --line: #eaded0;
            --pri: #c4500f;
            --pri-fg: #fff;
            --pri-soft: #fdeadb;
            --acc: #f2a900;
            --acc-soft: #fff3d1;
            --info: #2d6cb0;
            --info-soft: #e4eefa;
            --ok: #1b7a43;
            --ok-soft: #dff3e6;
            --warn: #8a5200;
            --warn-soft: #fff0d1;
            --err: #b3261e;
            --err-soft: #fde4e2;
            --shadow: 0 10px 40px rgba(60, 35, 10, .16);
            --logo-bg: transparent
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 15px;
            line-height: 1.45;
        }

        .phone {
            width: 100%;
            height: 100dvh;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            --w: 640px
        }

        .top {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--line);
            background: var(--surface);
            min-height: 56px
        }

        .top h1 {
            font-size: 17px;
            margin: 0;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .lg {
            background: var(--logo-bg);
            border-radius: 10px;
            padding: 3px 6px;
            display: inline-block;
            max-width: 100%
        }

        .lg img {
            display: block;
            height: 38px;
            width: auto;
            max-width: 100%
        }

        svg {
            vertical-align: -3px
        }

        .tile span {
            color: var(--pri)
        }

        .badge {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            display: grid;
            place-items: center
        }

        .brand {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0
        }

        .brand b {
            font-size: 15px;
            line-height: 1.1
        }

        .brand small {
            display: block;
            color: var(--muted);
            font-size: 11px
        }

        .ib {
            border: 0;
            background: var(--surface2);
            color: var(--fg);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            font-size: 17px;
            cursor: pointer;
            position: relative;
            flex: none
        }

        .ib .dot {
            position: absolute;
            top: 6px;
            right: 7px;
            min-width: 16px;
            height: 16px;
            border-radius: 8px;
            background: var(--err);
            color: #fff;
            font-size: 10px;
            display: grid;
            place-items: center;
            padding: 0 4px
        }

        .body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px
        }

        .tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-top: 1px solid var(--line);
            background: var(--surface);
            padding: 6px 6px 8px
        }

        .tab {
            border: 0;
            background: none;
            color: var(--muted);
            font: inherit;
            font-size: 11px;
            padding: 6px 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            border-radius: 12px
        }

        .tab span {
            font-size: 20px
        }

        .tab.on {
            color: var(--pri);
            font-weight: 700;
            background: var(--pri-soft)
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 14px
        }

        .card.flat {
            background: var(--surface2);
            border-color: transparent
        }

        .hero {
            background: linear-gradient(135deg, var(--pri), #1d7d68);
            color: #fff;
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .hero .big {
            font-size: 30px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1.1
        }

        .hero small {
            opacity: .85
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center
        }

        .between {
            justify-content: space-between
        }

        .wrap {
            flex-wrap: wrap
        }

        .col {
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .grow {
            flex: 1;
            min-width: 0
        }

        h2 {
            font-size: 16px;
            margin: 0
        }

        h3 {
            font-size: 14px;
            margin: 0
        }

        .muted {
            color: var(--muted)
        }

        .sm {
            font-size: 13px
        }

        .xs {
            font-size: 12px
        }

        .btn {
            border: 0;
            border-radius: 14px;
            padding: 13px 16px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            background: var(--pri);
            color: var(--pri-fg);
            width: 100%;
            min-height: 48px
        }

        .btn.sec {
            background: var(--pri-soft);
            color: var(--pri)
        }

        .btn.ghost {
            background: none;
            color: var(--pri);
            border: 1.5px solid var(--pri)
        }

        .btn.danger {
            background: var(--err-soft);
            color: var(--err)
        }

        .btn.sm {
            width: auto;
            min-height: 38px;
            padding: 8px 14px;
            font-size: 13px
        }

        .btn:disabled {
            opacity: .45;
            cursor: not-allowed
        }

        .btn:focus-visible,
        .ib:focus-visible,
        .tab:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible,
        .opt:focus-within,
        .link:focus-visible {
            outline: 3px solid var(--acc);
            outline-offset: 2px
        }

        .link {
            background: none;
            border: 0;
            color: var(--pri);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 0;
            text-align: left
        }

        label.f {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 13px;
            font-weight: 600
        }

        input[type=text],
        input[type=email],
        input[type=password],
        input[type=tel],
        input[type=number],
        input[type=date],
        select,
        textarea {
            font: inherit;
            font-weight: 400;
            background: var(--surface);
            color: var(--fg);
            border: 1.5px solid var(--line);
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            min-height: 46px
        }

        textarea {
            min-height: 90px;
            resize: vertical
        }

        input.bad,
        select.bad,
        textarea.bad {
            border-color: var(--err)
        }

        .err {
            color: var(--err);
            font-size: 12px;
            font-weight: 500
        }

        .pill {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 700
        }

        .pill.ok {
            background: var(--ok-soft);
            color: var(--ok)
        }

        .pill.warn {
            background: var(--warn-soft);
            color: var(--warn)
        }

        .pill.err {
            background: var(--err-soft);
            color: var(--err)
        }

        .pill.n {
            background: var(--surface2);
            color: var(--muted)
        }

        .opt {
            display: flex;
            gap: 10px;
            align-items: center;
            border: 1.5px solid var(--line);
            border-radius: 14px;
            padding: 12px;
            cursor: pointer
        }

        .opt.on {
            border-color: var(--pri);
            background: var(--pri-soft)
        }

        .opt input {
            accent-color: var(--pri);
            width: 18px;
            height: 18px;
            flex: none
        }

        .opt.dis {
            opacity: .5;
            cursor: not-allowed
        }

        .banner {
            border-radius: 14px;
            padding: 12px;
            font-size: 13px;
            line-height: 1.5
        }

        .banner.info {
            background: var(--pri-soft)
        }

        .banner.warn {
            background: var(--warn-soft);
            color: var(--warn)
        }

        .banner.ok {
            background: var(--ok-soft);
            color: var(--ok)
        }

        .banner.err {
            background: var(--err-soft);
            color: var(--err)
        }

        .tiles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        .tile {
            background: var(--surface2);
            border: 0;
            border-radius: 14px;
            padding: 12px;
            text-align: left;
            font: inherit;
            color: var(--fg);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 74px
        }

        .tile span {
            font-size: 22px
        }

        .tile b {
            font-size: 13px
        }

        .li {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--line)
        }

        .li:last-child {
            border-bottom: 0
        }

        .amt {
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            white-space: nowrap
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px
        }

        th,
        td {
            padding: 8px 6px;
            text-align: left;
            border-bottom: 1px solid var(--line)
        }

        th {
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .05em
        }

        td.r,
        th.r {
            text-align: right;
            font-variant-numeric: tabular-nums
        }

        .steps {
            display: flex;
            gap: 6px
        }

        .steps i {
            flex: 1;
            height: 5px;
            border-radius: 3px;
            background: var(--line)
        }

        .steps i.on {
            background: var(--pri)
        }

        .center {
            text-align: center;
            align-items: center
        }

        .sect {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--muted);
            font-weight: 700;
            margin-top: 4px
        }

        .copy {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface2);
            border-radius: 12px;
            padding: 10px 12px
        }

        .copy code {
            flex: 1;
            user-select: all;
            font-size: 14px;
            overflow-wrap: anywhere
        }

        .toast {
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: 84px;
            background: var(--fg);
            color: var(--bg);
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 13px;
            box-shadow: var(--shadow);
            z-index: 9
        }

        .chk {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            font-size: 13px
        }

        .chk input {
            width: 20px;
            height: 20px;
            accent-color: var(--pri);
            flex: none;
            margin-top: 1px
        }

        .pdf {
            background: #fff;
            color: #222;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px;
            font-size: 12px
        }

        .pdf table {
            font-size: 11px
        }

        .pdf th {
            color: #666
        }

        .pdf td,
        .pdf th {
            border-color: #ddd
        }

        .phone.wide {
            --w: 960px
        }

        .phone.auth {
            --w: 440px
        }

        .top {
            padding-inline: max(16px, calc((100% - var(--w))/2))
        }

        .body {
            padding-block: 20px;
            padding-inline: max(16px, calc((100% - var(--w))/2))
        }

        .phone.auth {
            background: var(--surface)
        }

        @media (min-width:640px) {
            .body.home {
                display: grid;
                grid-template-columns: 1fr 1fr;
                align-content: start;
                align-items: start;
                gap: 16px
            }

            .body.home>.hero,
            .body.home>.tiles,
            .body.home>div:first-child {
                grid-column: 1/-1
            }

            .body.home>.tiles {
                grid-template-columns: repeat(4, 1fr)
            }

            .toast {
                max-width: 420px;
                margin-inline: auto
            }
        }

        @media (min-width:1024px) {
            .phone.withnav {
                display: grid;
                grid-template-columns: 230px 1fr;
                grid-template-rows: auto 1fr
            }

            .phone.withnav>.tabs {
                grid-column: 1;
                grid-row: 1/3;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                gap: 6px;
                border-top: 0;
                border-right: 1px solid var(--line);
                padding: 20px 12px;
                background: var(--surface2)
            }

            .phone.withnav>.tab,
            .phone.withnav .tab {
                flex-direction: row;
                font-size: 15px;
                gap: 12px;
                padding: 13px 14px;
                justify-content: flex-start
            }

            .phone.withnav>.top {
                grid-column: 2;
                grid-row: 1
            }

            .phone.withnav>.body {
                grid-column: 2;
                grid-row: 2;
                background: var(--bg)
            }

            .body .card,
            .body .opt {
                background: var(--surface)
            }

            .toast {
                bottom: 24px
            }
        }
    </style>
</head>

<body>

    <div class="phone" id="app"></div>
    <script>
        const LOGO = 'logo.png';
        const P = {home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>', card: '<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/>', cal: '<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/>', user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>', phone: '<path d="M5 3h4l2 5-2.5 1.5a11 11 0 005 5L15 12l5 2v4a2 2 0 01-2 2A16 16 0 013 5a2 2 0 012-2z"/>', bell: '<path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 004 0"/>', doc: '<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h7M9 17h7"/>', receipt: '<path d="M5 2h14v20l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/>', help: '<circle cx="12" cy="12" r="10"/><path d="M9.5 9a2.5 2.5 0 115 .5c0 1.5-2.5 2-2.5 3.5M12 17h.01"/>', edit: '<path d="M12 20h9"/><path d="M16.5 3.5l4 4L8 20l-5 1 1-5z"/>', check: '<circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/>', mail: '<rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 7l10 7 10-7"/>', clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'};
        const ic = (n, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
        const badge = (n, k) => `<div class="badge" style="background:var(--${k}-soft);color:var(--${k})">${ic(n, 38)}</div>`;
        const $ = s => document.querySelector(s);
        const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
        const peso = n => '₱' + Number(n).toLocaleString('en-PH', {minimumFractionDigits: 0, maximumFractionDigits: 2});
        const S = {
            user: null, screen: 'welcome', hist: [], tab: 'home', f: {}, errs: {}, fails: 0, toast: '', menu: false, archive: false, open: null,
            acct: {first: 'Maria', middle: 'Reyes', last: 'Santos', email: 'santos@example.com', phone: '0917 123 4567', block: 5, lot: 12, phase: 2, pass: 'Sunrise2026'},
            months: [{m: 'September 2026', due: 100, paid: 50}, {m: 'October 2026', due: 100, paid: 0}],
            pays: [
                {id: 1, date: 'Aug 5, 2026', month: 'August 2026', amt: 100, method: 'GCash', ref: '7203948110', st: 'Verified'},
                {id: 2, date: 'Jul 6, 2026', month: 'July 2026', amt: 100, method: 'Cash (office)', ref: '—', st: 'Verified'},
                {id: 3, date: 'Sep 14, 2026', month: 'September 2026', amt: 50, method: 'Maya', ref: '5521908834', st: 'Verified'}],
            appts: [{id: 1, purpose: 'Payment', date: 'Fri, Oct 16', time: '10:00 AM', st: 'Confirmed'}], pastAppts: [{purpose: 'Document claim', date: 'Sep 8', time: '2:00 PM', st: 'Completed'}],
            notifs: [{t: 'Payment verified', d: 'Your ₱50 payment for September was verified.', time: 'Sep 15', unread: true}, {t: 'Appointment reminder', d: 'Payment visit on Fri, Oct 16 at 10:00 AM.', time: 'Today', unread: true}, {t: 'New announcement', d: 'Water interruption on Oct 20.', time: 'Oct 9', unread: false}],
            news: [{id: 1, t: 'Water interruption on Oct 20', d: 'Oct 9', b: 'Maintenance work on the main line will pause water supply from 9:00 AM to 3:00 PM in Phases 1–2. Please store water in advance.', a: false},
            {id: 2, t: 'Monthly dues now due on the 15th', d: 'Oct 1', b: 'Reminder: monthly dues are ₱100 and are due on the 15th. Pay online or book an office visit.', a: false},
            {id: 3, t: 'General Assembly — Sept 28', d: 'Sep 20', b: 'Minutes of the General Assembly are available at the HOA office.', a: true},
            {id: 4, t: 'Clean-up drive results', d: 'Aug 30', b: 'Thank you to everyone who joined the clean-up drive.', a: true}],
            sessions: [{d: 'This device — Chrome', t: 'Now', cur: true}, {d: 'Phone — Safari', t: 'Oct 10, 7:42 PM'}, {d: 'Laptop — Edge', t: 'Oct 2, 9:15 AM'}],
            days: [{k: 'Tue, Oct 13', left: [1, 1, 0, 1, 1, 1]}, {k: 'Wed, Oct 14', full: true}, {k: 'Thu, Oct 15', left: [1, 1, 1, 1, 0, 1]}, {k: 'Fri, Oct 16', left: [1, 0, 1, 1, 1, 1]}, {k: 'Mon, Oct 19', left: [1, 1, 1, 1, 1, 1]}],
            slots: ['9:00 AM', '10:00 AM', '11:00 AM', '1:00 PM', '2:00 PM', '3:00 PM']
        };
        const pending = () => S.pays.filter(p => p.st.startsWith('Pending')).reduce((a, p) => a + p.amt, 0);
        const monthPending = m => S.pays.filter(p => p.st.startsWith('Pending') && p.month === m).reduce((a, p) => a + p.amt, 0);
        const rem = m => m.due - m.paid - monthPending(m.m);
        const total = () => S.months.reduce((a, m) => a + rem(m), 0);
        const unread = () => S.notifs.filter(n => n.unread).length;
        const AUTH = ['welcome', 'login', 'register', 'regdone', 'forgot', 'forgotdone'];
        const TABOF = {home: 'home', statement: 'home', announce: 'home', notifs: 'home', contact: 'home', faq: 'home', pay: 'pay', payflow: 'pay', review: 'pay', paydone: 'pay', history: 'pay', appts: 'appts', book: 'appts', bookreview: 'appts', bookdone: 'appts', correction: 'appts', profile: 'profile'};
        function go(s, keep) {if (S.screen !== s) S.hist.push(S.screen); S.screen = s; S.errs = {}; S.menu = false; if (!keep) S.f = S.f; render(); const b = $('.body'); if (b) b.scrollTop = 0}
        function back() {S.screen = S.hist.pop() || (S.user ? 'home' : 'welcome'); S.errs = {}; render()}
        function root(s) {S.hist = []; S.screen = s; S.errs = {}; S.menu = false; render()}
        function toast(m) {S.toast = m; render(); clearTimeout(toast.t); toast.t = setTimeout(() => {S.toast = ''; render()}, 2600)}
        function hdr(title, opts = {}) {
            if (opts.home) return `<div class="top"><div class="brand" style="flex-direction:column;align-items:flex-start;gap:3px"><span class="lg"><img src="${LOGO}" alt="Sunrise Place Homeowners Association"></span><small>Block ${S.acct.block} · Lot ${S.acct.lot} · Phase ${S.acct.phase}</small></div>
 <button class="ib" data-a="go" data-v="contact" aria-label="Contact HOA">${ic('phone', 20)}</button>
 <button class="ib" data-a="go" data-v="notifs" aria-label="Notifications, ${unread()} unread">${ic('bell', 20)}${unread() ? `<span class="dot">${unread()}</span>` : ''}</button></div>`;
            return `<div class="top"><button class="ib" data-a="back" aria-label="Back">←</button><h1>${esc(title)}</h1></div>`;
        }

                else {S.fails++; S.errs.login = 'Email or password is incorrect.'; render()}
            },
            forgot() {S.errs = {}; const e = S.f.femail || ''; if (!/^\S+@\S+\.\S+$/.test(e)) {S.errs.femail = 'Enter a valid email.'; render(); return } go('forgotdone')},
            register() {
                S.errs = {}; const f = S.f;
                need('rfirst', 'First name is required.'); need('rlast', 'Last name is required.');
                if (!/^\S+@\S+\.\S+$/.test(f.remail || '')) S.errs.remail = 'Enter a valid email.';
                if ((f.rpass || '').length < 8) S.errs.rpass = 'Use at least 8 characters.';
                if (f.rpass2 !== f.rpass) S.errs.rpass2 = 'Passwords do not match.';
                need('rblock', 'Required.'); need('rlot', 'Required.'); need('rphase', 'Choose a phase.'); need('rcode', 'Activation code is required.');
                if (!f.rterms) S.errs.rterms = 'Please accept to continue.';
                if (!Object.keys(S.errs).length) {if ((f.rcode || '').trim().toUpperCase() !== 'SP-4821') {S.errs.rcode = 'We couldn’t match these details to HOA records. Check them or ask the HOA office.'} }
                if (Object.keys(S.errs).length) {render(); const el = $('.bad,.err'); if (el) el.scrollIntoView({block: 'center'}); return }
                S.acct = {...S.acct, first: f.rfirst, middle: f.rmid || '', last: f.rlast, email: f.remail.toLowerCase(), pass: f.rpass, block: f.rblock, lot: f.rlot, phase: f.rphase}; S.f = {}; go('regdone')
            },
            startpay(v) {S.f = {pmonth: v, pamt: rem(S.months.find(m => m.m === v))}; go('payflow')},
            copy(v) {try {navigator.clipboard.writeText(v).then(() => toast('Copied'), () => toast('Select the text and copy it'))} catch (e) {toast('Select the text and copy it')} },
            payreview() {
                S.errs = {}; const f = S.f; const m = S.months.find(x => x.m === f.pmonth); const amt = Number(f.pamt);
                if (!(amt > 0)) S.errs.pamt = 'Enter the amount you paid.'; else if (amt > rem(m)) S.errs.pamt = 'That is more than the remaining ' + peso(rem(m)) + '.';
                need('pmethod', 'Choose a method.');
                if (!/^\d{6,}$/.test((f.pref || '').trim())) S.errs.pref = 'Enter the reference number (digits only, at least 6).';
                else if (S.pays.some(p => p.ref === f.pref.trim())) S.errs.pref = 'This reference number was already used. Check for typos.';
                need('pdate', 'Pick the date you paid.');
                if (Object.keys(S.errs).length) {render(); return } go('review')
            },
            paysubmit() {
                const f = S.f; S.pays.push({id: S.pays.length + 1, date: 'Oct 12, 2026', month: f.pmonth, amt: Number(f.pamt), method: f.pmethod, ref: f.pref.trim(), st: 'Pending verification'});
                S.notifs.unshift({t: 'Payment received', d: peso(f.pamt) + ' for ' + f.pmonth + ' is awaiting verification.', time: 'Just now', unread: true}); go('paydone')
            },
            simverify() {S.pays.forEach(p => {if (p.st.startsWith('Pending')) {p.st = 'Verified'; const m = S.months.find(x => x.m === p.month); if (m) m.paid += p.amt} }); S.notifs.unshift({t: 'Payment verified', d: 'Your payment was verified by staff.', time: 'Just now', unread: true}); toast('Staff verified your payment')},
            dl() {toast('Prototype: the PDF download would start here')},
            open(v) {S.open = S.open == v || v === '0' ? null : (isNaN(v) ? v : Number(v)); render()},
            cancel(v) {S.appts = S.appts.filter(a => a.id != v); S.open = null; S.notifs.unshift({t: 'Appointment cancelled', d: 'Your visit was cancelled.', time: 'Just now', unread: false}); toast('Appointment cancelled')},
            resched(v) {S.appts = S.appts.filter(a => a.id != v); S.f = {bpurpose: 'Payment'}; go('book')},
            bookreview() {S.errs = {}; need('bpurpose', 'Choose a purpose.'); if (!S.f.bday) S.errs.bday = 'Pick a day.'; else if (!S.f.btime) S.errs.btime = 'Pick a time.'; if (Object.keys(S.errs).length) {render(); return } go('bookreview')},
            bookconfirm() {S.appts.push({id: Date.now(), purpose: S.f.bpurpose, date: S.f.bday, time: S.f.btime, st: 'Confirmed'}); go('bookdone')},
            corr() {S.errs = {}; need('ctype', 'Choose a type.'); need('cdesc', 'Please describe the problem.'); if (Object.keys(S.errs).length) {render(); return } S.f = {}; S.hist.pop(); S.screen = TABOF[S.hist[S.hist.length - 1]] ? S.hist[S.hist.length - 1] : 'home'; render(); toast('Request sent. Staff will review it.')},
            arch(v) {S.archive = v === '1'; S.open = null; render()},
            readall() {S.notifs.forEach(n => n.unread = false); render()},
            logoutall() {S.sessions = [S.sessions[0]]; render(); toast('Logged out of other devices')},
            logout() {S.user = null; S.f = {}; root('welcome')}
        };
        document.addEventListener('click', e => {const t = e.target.closest('[data-a]'); if (t && A[t.dataset.a]) {e.preventDefault(); A[t.dataset.a](t.dataset.v, t)} });
        function onF(e) {
            const t = e.target; if (!t.dataset || !t.dataset.f) return; S.f[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value;
            if (e.type === 'change' && (t.dataset.r || t.dataset.f === 'pmethod' || t.dataset.f === 'bpurpose')) {if (t.dataset.f === 'bday') S.f.btime = ''; render()}
        }
        document.addEventListener('input', onF); document.addEventListener('change', onF);
        render();
    </script>

</body>
